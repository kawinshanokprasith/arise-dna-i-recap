<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Photos, videos and notes from ARISE Tech Meetup 12 - DNA-i, in the order they were shot, with English and Thai captions.">
<title>Inside DNA-i</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap">
<style>
/* Owloo look: warm paper ground, hairlines instead of shadows, Kondolar headings, pill controls.
   Lime appears once per screen: the owl. Layout: sunken agenda rail on the left (jump between talks),
   one page on the right with the slideshow, a caption written by the owl, and a filmstrip. */
@font-face { font-family: "Kondolar"; src: url("fonts/kondolar-black.otf") format("opentype"); font-weight: 900; font-display: swap; }
@font-face { font-family: "Kondolar"; src: url("fonts/kondolar-bold.otf") format("opentype"); font-weight: 700; font-display: swap; }

:root {
  --background: #faf9f5; --card: #ffffff; --sunken: #f3f2ec; --hover: #eceae2;
  --border: #e7e5dd; --border-strong: #cfccc1;
  --ink: #292929; --ink-secondary: #6b6a63; --ink-tertiary: #7c7a72; --on-ink: #fcfcf8;
  --lime: #d1e043; --on-lime: #292929; --lime-soft: #eef4c2; --olive: #4d5a1e;
  --chart-rest: #a9a79e;
  --shadow-raised: 0 1px 2px rgba(0,0,0,.08);
  --font-display: Kondolar, "Chakra Petch", "Noto Sans Thai", Georgia, serif;
  --font-sans: Inter, "Google Sans", "Noto Sans Thai", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-7: 28px;
  --radius-md: 10px; --radius-lg: 14px; --radius-xl: 16px; --radius-pill: 999px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background: #1b1b19; --card: #232320; --sunken: #2a2a27; --hover: #33332f;
    --border: #34342f; --border-strong: #4a4a44;
    --ink: #f1f0ea; --ink-secondary: #a9a79e; --ink-tertiary: #8e8c84; --on-ink: #1b1b19;
    --lime-soft: #3a4216; --olive: #c9d86a; --chart-rest: #6b6a63;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --background: #1b1b19; --card: #232320; --sunken: #2a2a27; --hover: #33332f;
  --border: #34342f; --border-strong: #4a4a44;
  --ink: #f1f0ea; --ink-secondary: #a9a79e; --ink-tertiary: #8e8c84; --on-ink: #1b1b19;
  --lime-soft: #3a4216; --olive: #c9d86a; --chart-rest: #6b6a63;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--background); color: var(--ink); font: 400 15px/1.5 var(--font-sans); overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:active { transform: scale(.98); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 324px minmax(0, 1fr); height: 100%; }

/* ---------- agenda rail (sunken, like the app sidebar) ---------- */
.rail { min-height: 0; overflow-y: auto; background: var(--sunken); border-right: 1px solid var(--border);
  padding-block: 0 28px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: 16px;
  scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
.rail-head { position: sticky; top: 0; z-index: 4; display: grid; gap: 6px; padding: 28px 16px 22px max(20px, env(safe-area-inset-left, 0px)); margin: 0 -16px 20px calc(-1 * max(20px, env(safe-area-inset-left, 0px))); background: var(--sunken); border-bottom: 1px solid var(--border); }
@media (max-height: 760px) { .rail-head { position: static; } }
.eyebrow { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .02em; color: var(--olive); }
.rail h1 { margin: 0; font: 900 46px/0.98 var(--font-display); padding: 2px 0 6px; letter-spacing: -.005em; }
.rail-head .eyebrow { font-size: 12px; font-weight: 500; color: var(--ink-secondary); }
.rail-head .blurb { font-size: 12.5px; color: var(--ink-tertiary); }
.rail-owl { position: relative; width: 322px; height: 286px; margin: 0 0 2px -2px; pointer-events: none; }
.rail-owl canvas { position: absolute; display: block; }
.blurb { margin: 0; font-size: 14px; color: var(--ink-secondary); max-width: 32ch; }
.keys { display: none; margin: 6px 0 0; font-size: 12px; line-height: 1.9; color: var(--ink-tertiary); }
kbd { font: 400 11px/1 var(--font-mono); color: var(--ink-secondary); background: var(--card); border: 1px solid var(--border); border-radius: 5px; padding: 2px 5px; }

.agenda ol { list-style: none; margin: 0; padding: 0; }
.ag { position: relative; padding-bottom: 20px; }
.ag-row { padding: 9px 10px 9px 6px !important; margin: -9px -10px -9px -6px !important; border-radius: 14px; transition: background .15s, box-shadow .15s; display: grid; grid-template-columns: 14px minmax(0, 1fr); column-gap: 12px; width: 100%; padding: 0; margin: 0; text-align: left; background: none; border: 0; }
.ag .time { display: none; justify-self: end; align-self: start; font: 400 12px/1.5 var(--font-mono); color: var(--ink-tertiary); white-space: nowrap; font-variant-numeric: tabular-nums; padding: 0 6px; border-radius: 6px; }
.ag .dot { position: relative; }
.ag .dot::before { content: ""; position: absolute; left: 6px; top: 2px; bottom: -20px; width: 1px; background: var(--border-strong); }
.ag:last-child .dot::before { display: none; }
.ag .dot::after { content: ""; position: absolute; left: 2px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--sunken); border: 1.5px solid var(--border-strong); }
.ag .body { display: grid; gap: 2px; min-width: 0; }
.ag .title { font: 900 18px/1.3 var(--font-display); letter-spacing: .005em; color: var(--ink); text-wrap: balance; }
.ag .sub { font-size: 13px; color: var(--ink-secondary); }
.ag .who { font-size: 12px; color: var(--ink-secondary); }
.ag .count { margin-top: 2px; font-size: 12px; color: var(--ink-tertiary); }
.ag.has-media .dot::after { border-color: var(--ink-secondary); }
.ag .ag-row:hover .title { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.ag.active .dot::after { background: var(--ink); border-color: var(--ink); }
.ag.active .ag-row { background: var(--card); box-shadow: 0 0 0 1px var(--border-strong), var(--shadow-raised); }
.ag.active .time { background: var(--lime-soft); color: var(--olive); }
.ag.empty .title { color: var(--ink-secondary); font-weight: 500; }
.rail-foot { margin: 6px 0 0; padding-left: 26px; font-size: 12px; color: var(--ink-tertiary); max-width: 44ch; }

/* ---------- main page ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; gap: 12px;
  padding-block: 16px 14px; padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.topbar { display: flex; align-items: center; gap: 12px; min-height: 40px; }
.talks-btn { display: none; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: var(--radius-pill); border: 0; background: var(--card); box-shadow: inset 0 0 0 1px var(--border); font-size: 14px; font-weight: 500; }
.now { min-width: 0; flex: 1; display: flex; align-items: baseline; gap: 10px; }
.now-label { font-size: 13px; font-weight: 600; color: var(--olive); white-space: nowrap; }
.now-title { font: 700 21px/1.25 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 0; }
.counter { font: 400 12px/1 var(--font-mono); color: var(--ink-tertiary); white-space: nowrap; font-variant-numeric: tabular-nums; }
.segs { display: inline-flex; gap: 4px; padding: 4px; border-radius: var(--radius-pill); background: var(--card); border: 1.5px solid var(--ink); }
.seg-btn { height: 34px; padding: 0 18px; border: 0; border-radius: var(--radius-pill); background: transparent; color: var(--ink); font-size: 15px; font-weight: 600; cursor: pointer; }
.seg-btn:hover { background: var(--sunken); }
.seg-btn[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.seg-btn[aria-pressed="true"]:hover { background: var(--ink); }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; border: 0; background: var(--card); box-shadow: inset 0 0 0 1px var(--border); color: var(--ink); }
.icon-btn:hover, .talks-btn:hover, .nav-btn:hover { background: var(--hover); }
.icon-btn svg, .nav-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.progress { display: flex; gap: 4px; height: 12px; align-items: center; }
.pseg { position: relative; flex: 1 1 0; min-width: 6px; height: 12px; padding: 0; border: 0; background: none; }
.pseg::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 4px; border-radius: 2px; background: var(--border); }
.pseg .fill { position: absolute; left: 0; top: 4px; height: 4px; border-radius: 2px; background: var(--chart-rest); width: 0; transition: width .2s ease-out; }
.pseg.current .fill { background: var(--ink); }
.pseg:hover::before { background: var(--border-strong); }

.stage { position: relative; flex: 1 1 auto; min-height: 200px; background: var(--sunken); border: 1px solid var(--border); border-radius: var(--radius-xl); overflow: hidden; touch-action: pan-y; }
.slide { position: absolute; inset: 0; display: grid; place-items: center; animation: fadein .2s ease-out both; }
.slide img, .slide video { width: 100%; height: 100%; object-fit: contain; display: block; background: var(--sunken); }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.nav-btn { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; border: 0; background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1px var(--border-strong); }
.nav-btn:active { transform: translateY(-50%) scale(.98); }
.nav-btn[disabled] { opacity: .45; cursor: default; }
.nav-prev { left: 12px; } .nav-next { right: 12px; }
.vbadge { position: absolute; left: 14px; top: 14px; z-index: 2; display: flex; gap: 8px; align-items: center; height: 26px; padding: 0 12px; border-radius: var(--radius-pill); background: var(--card); box-shadow: inset 0 0 0 1px var(--border); font: 500 12px/1 var(--font-sans); color: var(--ink); pointer-events: none; }
.vbadge i { width: 0; height: 0; border-left: 7px solid var(--ink); border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.vparts { position: absolute; right: 14px; top: 14px; z-index: 2; display: flex; gap: 6px; }
.vparts button { width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 0; background: var(--card); box-shadow: inset 0 0 0 1px var(--border); font: 500 12px/1 var(--font-mono); color: var(--ink-secondary); }
.vparts button.on { background: var(--lime-soft); color: var(--olive); font-weight: 500; }

/* talk title card: paper page, Kondolar title, "In short" style box */
.intro { width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 14px; background: var(--card); padding: clamp(24px, 6vw, 80px); }
.intro > :first-child { margin-top: auto; }
.intro > :last-child { margin-bottom: auto; }
.intro > * { max-width: 780px; }
.intro h2 { margin: 0; font: 900 clamp(34px, 5.6vw, 68px)/1.2 var(--font-display); padding: 4px 0; text-wrap: balance; }
.intro .tsub { margin: 0; font-size: clamp(16px, 1.8vw, 20px); color: var(--ink-secondary); }
.inshort { background: var(--lime-soft); color: var(--ink); border-radius: var(--radius-lg); padding: 18px 20px; font-size: 16px; display: grid; gap: 4px; margin-top: 6px; }
.inshort b { font-size: 13px; color: var(--olive); }
.inshort ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.inshort .tcount { margin: 6px 0 0; font-size: 14px; color: var(--olive); }
/* the talk pages: off-black, so the owl and the title stand out */
.slide { container-type: inline-size; }
.intro.dark { flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 12px; background: #1b1b19; color: #f1f0ea; }
.intro.dark > * { margin: 0 !important; }
.intro.dark > :first-child { margin-top: auto !important; }
.intro.dark > :last-child { margin-bottom: auto !important; }
.intro-text { min-width: 0; max-width: 640px; display: grid; gap: 14px; }
.intro-owl { position: relative; flex: 0 0 auto; order: -1; width: 391px; height: 300px; transform: scale(.62); transform-origin: 0 0; margin-bottom: -114px !important; }
.intro-owl canvas { position: absolute; display: block; pointer-events: none; }
.intro.dark .eyebrow { color: #a9a79e; }
.intro.dark h2 { color: #fcfcf8; line-height: 1.02; }
.intro.dark .tsub { color: #bdbbb2; }
.intro .tsum { margin: 0; font-size: clamp(14px, 0.6vw + 8px, 17px); font-weight: 300; line-height: 1.5; color: #bdbbb2; max-width: 46ch; }
.intro.dark .inshort { background: #262624; border: 1px solid #3b3b38; color: #f1f0ea; margin-top: 4px; }
.intro.dark .inshort b { color: #a9a79e; }
@container (min-width: 920px) { .intro.dark { flex-direction: row; align-items: center; justify-content: center; gap: 28px 56px; } .intro-owl { order: 1; transform: none; margin-bottom: 0 !important; } .intro-text { flex: 1 1 380px; } }

/* the owl takes the notes: caption sits beside it */
.note { display: grid; grid-template-columns: 172px minmax(0, 1fr); gap: 12px; align-items: start; min-height: 100px; }
.owl-wrap { position: relative; width: 161px; height: 125px; margin-top: 4px; }
.owl-wrap canvas { position: absolute; display: block; pointer-events: none; }
.owl { background-repeat: no-repeat; background-position: 0 0; image-rendering: auto; flex: none; }
.owl.write { width: 128px; height: 96px; background-image: url("media/owl/writing.png"); background-size: 600% 100%; }
.owl.branch { width: 96px; height: 96px; background-image: url("media/owl/branch-light.png"); background-size: 500% 100%; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .owl.branch { background-image: url("media/owl/branch-dark.png"); } }
:root[data-theme="dark"] .owl.branch { background-image: url("media/owl/branch-dark.png"); }
.caption { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 14px; align-items: start; align-content: start; padding: 4px 0 6px; }
.ctime { font: 400 12px/1.6 var(--font-mono); color: var(--olive); background: var(--lime-soft); border-radius: 6px; padding: 0 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ctime:empty { display: none; }
.caption .ctext { grid-column: 2; }
.ctext { margin: 0; font-size: 16px; line-height: 1.5; max-width: 90ch; }
:root[lang="th"] .ctext { line-height: 1.65; }
.clink { height: 28px; padding: 0 12px; display: inline-flex; align-items: center; border-radius: var(--radius-pill); font-size: 13px; font-weight: 500; color: var(--ink); text-decoration: none; white-space: nowrap; }
.clink:hover { background: var(--hover); }

.strip { display: flex; gap: 8px; overflow-x: auto; padding: 6px 6px 8px; flex: 0 0 auto; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
.thumb { position: relative; flex: 0 0 auto; width: 96px; height: 64px; padding: 0; border: 0; border-radius: var(--radius-md); overflow: hidden; background: var(--sunken); box-shadow: inset 0 0 0 1px var(--border); opacity: .72; }
.thumb:hover { opacity: 1; }
.thumb[aria-current="true"] { opacity: 1; box-shadow: 0 0 0 2px var(--ink); outline: 0; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .tag { position: absolute; left: 5px; bottom: 5px; padding: 2px 6px; border-radius: var(--radius-pill); background: var(--card); font: 500 10px/1.3 var(--font-mono); color: var(--ink); }
.thumb.intro-t { display: flex; flex-direction: column; justify-content: flex-end; text-align: left; padding: 7px 8px; background: #1b1b19; color: #fff; font: 900 10.5px/1.15 var(--font-display); letter-spacing: .01em; box-shadow: none; }
.thumb.intro-t .ti { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.thumb.intro-t .tk { font: 700 8px/1 var(--font-mono); color: #D1E043; margin-bottom: 4px; }
.thumb.intro-t.light { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1px var(--border); }
.thumb.intro-t.light .tk { color: var(--olive); }

/* ----- zoomable media ----- */
.stage.zoomable { touch-action: none; }
.zwrap { position: absolute; inset: 0; transform-origin: 0 0; will-change: transform; }
.zwrap img, .zwrap video { width: 100%; height: 100%; object-fit: contain; display: block; background: var(--sunken); -webkit-user-drag: none; user-select: none; }
.stage.zoomed-in .zwrap { cursor: grab; }
.stage.dragging .zwrap { cursor: grabbing; }
.zoomctl { position: absolute; right: 12px; bottom: 12px; z-index: 4; display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: var(--radius-pill); background: var(--card); box-shadow: inset 0 0 0 1px var(--border-strong); }
.zoomctl[hidden] { display: none; }
.zbtn, .zlabel { height: 32px; border: 0; background: transparent; color: var(--ink); border-radius: var(--radius-pill); }
.zbtn { width: 32px; font-size: 18px; line-height: 1; }
.zlabel { min-width: 56px; padding: 0 8px; font: 400 12px/1 var(--font-mono); color: var(--ink-secondary); font-variant-numeric: tabular-nums; }
.zbtn:hover, .zlabel:hover { background: var(--hover); }
.vbar { position: absolute; left: 12px; right: 200px; bottom: 12px; z-index: 4; height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 6px; border-radius: var(--radius-pill); background: var(--card); box-shadow: inset 0 0 0 1px var(--border-strong); }
.vb-btn { width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--ink); display: grid; place-items: center; flex: none; }
.vb-btn:hover { background: var(--hover); }
.vb-seek { flex: 1; min-width: 0; accent-color: var(--ink); height: 4px; margin: 0; }
.vb-time { font: 400 12px/1 var(--font-mono); color: var(--ink-secondary); white-space: nowrap; font-variant-numeric: tabular-nums; }
.nav-btn { z-index: 5; }

/* ----- cover and front pages ----- */
.page { width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden; background: var(--card); padding: clamp(20px, 4.5vw, 56px); display: flex; flex-direction: column; gap: 16px; }
.page > * { max-width: 980px; }
.intro, .page { padding-inline: max(clamp(24px, 6vw, 80px), 88px); }
@media (max-width: 860px) { .intro, .page { padding-inline: 64px; } }
.page .eyebrow { margin: 0; }
.page.cover { flex-direction: row; gap: clamp(20px, 4vw, 48px); align-items: stretch; padding-block: clamp(20px, 4vw, 48px); }
.page.cover > * { max-width: none; }
.cv-main { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; margin-block: auto; gap: 14px; }
.cv-title { margin: 0; font: 900 clamp(46px, 8vw, 104px)/1.15 var(--font-display); padding: 4px 0; text-wrap: balance; }
.cv-sub { margin: 0; font-size: clamp(17px, 1.9vw, 22px); color: var(--ink-secondary); max-width: 38ch; }
.page.cover { background: #1b1b19; color: #f1f0ea; }
.page.cover .eyebrow { color: #a9a79e; }
.page.cover .cv-title { color: #fcfcf8; }
.page.cover .cv-sub { color: #bdbbb2; max-width: 46ch; font-weight: 300; }
.page.cover .inshort { background: #262624; border: 1px solid #3b3b38; color: #f1f0ea; }
.page.cover .inshort b { color: #a9a79e; }
.page.cover .pill-btn { background: #f1f0ea; color: #1b1b19; box-shadow: none; }
.page.cover .cv-start { height: 64px; padding: 0 36px; font-size: 20px; font-weight: 600; }
.page.cover .pill-btn:hover { background: #fff; }
.cv-main .inshort { max-width: 620px; }
.inshort-text { margin: 0; font-size: 17px; }
.cv-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 4px; }
.cv-row .hint { font-size: 12px; color: var(--ink-tertiary); }
.cv-art { flex: 0 0 clamp(300px, 46%, 520px); display: flex; flex-direction: column; justify-content: center; min-width: 0; margin-block: auto; }
.cv-poster { margin: 0; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border-strong); background: #0b0b0b; }
.cv-poster img { display: block; width: 100%; height: auto; }
.cv-owl { position: relative; width: 253px; height: 192px; margin: -36px 0 0 14px; pointer-events: none; }
.cv-owl canvas { position: absolute; display: block; pointer-events: none; }
.a-soft { fill: var(--lime-soft); } .a-ink { fill: var(--ink); } .a-olive { fill: var(--olive); } .a-pill { fill: var(--lime-soft); } .a-sunk { fill: var(--sunken); }
.pt { margin: 0; font: 900 clamp(28px, 4.2vw, 52px)/1.2 var(--font-display); padding: 4px 0; text-wrap: balance; max-width: 20ch; }
.pintro { margin: 0; font-size: 17px; max-width: 72ch; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
.cards.two { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.fcard { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 20px 22px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fcard .kind { font-size: 13px; font-weight: 600; color: var(--olive); }

<script>

    var p = Rig.Pose(); p.eyes = 1; p.ears = 0.3; p.breathe = Math.sin(t * 1.6);
    var notice = k(0.1, 0.45);
    p.eyes = (t > 0.05 && t < 0.15) ? 0.1 : 1;
    if (kind === "peck") {
      p.look = 0.85 * notice * side; p.gaze = 1.4 * notice * side;
      p.roll = 0.22 * notice * (1 - k(0.5, 0.7)) * side;
      var wind = k(0.65, 1.0);
      var dip = function (a, b) { return k(a, a + 0.1) * (1 - k(a + 0.1, b)); };
      var d = Math.max(dip(1.0, 1.35), dip(1.45, 1.8));
      p.lookY = -0.1 * notice - 0.5 * wind * (1 - k(0.98, 1.0)) + 1.0 * d;
      p.tilt = (-0.1 * wind * (1 - d) + 0.36 * d) * side;
      p.stretch = 0.3 * wind * (1 - d) - 0.5 * d;
      p.ears = 0.3 + 0.5 * wind * (1 - d) - 0.7 * d;
      p.look = lerp(0.85 * notice, 0.95, d) * side;
      if (t >= 1.95) {
        var s = k(1.95, 2.25) * (1 - k(2.7, 2.8));
        p.smile = s; p.eyes = (t > 2.15 && t < 2.55) ? 0.05 : 1;
        p.look = lerp(0.85, 0.3, k(1.95, 2.4)) * side; p.roll = 0.12 * s * side; p.tilt = 0;
      }
      return p;
    }
    p.look = 0.75 * notice * side; p.lookY = 0.2 * notice; p.gaze = 1.3 * notice * side;
    p.roll = 0.2 * notice * (1 - k(0.55, 0.7)) * side;
    var wind2 = k(0.6, 1.25), hit = k(1.25, 1.36), pull = k(1.62, 2.2);
    var back = { x: 31 + 12 * side, y: 24 }, rest = { x: 31 + 14 * side, y: 58 };
    var shoulder = { x: 31 + 10 * side, y: 40 }, maxReach = 30, target = aim;
    var dx = aim.x - shoulder.x, dy = aim.y - shoulder.y, dist = Math.hypot(dx, dy);
    if (dist > maxReach) target = { x: shoulder.x + dx / dist * maxReach, y: shoulder.y + dy / dist * maxReach };
    var hand, amt;
    if (t < 1.25) { hand = back; amt = wind2; }
    else if (t < 1.62) { hand = { x: lerp(back.x, target.x, hit), y: lerp(back.y, target.y, hit) }; amt = 1; }
    else { hand = { x: lerp(target.x, rest.x, pull), y: lerp(target.y, rest.y, pull) }; amt = 1 - k(2.0, 2.2); }
    var burst = (!whiff && t >= 1.3 && t < 1.55) ? 1 - (t - 1.3) / 0.25 : 0;
    p.reach = { side: side, to: hand, amt: amt, hit: burst };
    p.tilt = (-0.1 * wind2 * (1 - hit) + 0.3 * hit * (1 - pull)) * side;
    p.stretch = 0.4 * wind2 * (1 - hit);
    p.ears = 0.3 + 0.5 * wind2 * (1 - hit) - 0.5 * hit;
    if (t >= 1.25 && t < 1.7) p.eyes = 0.45;
    if (whiff) {
      var w = k(1.36, 1.55);
      p.tilt = (-0.1 * wind2 * (1 - hit) + 0.3 * hit * (1 - pull) + Math.sin(t * 14) * 0.08 * w * (1 - k(1.9, 2.4))) * side;
      p.blush = k(1.6, 2.0) * (1 - k(3.3, 3.6));
      if (t >= 1.6) { p.look = lerp(0.75, -0.55, k(1.7, 2.1)) * side; p.gaze = p.look * 1.4; p.eyes = 0.7; }
      p.lookY = 0.1 + 0.5 * k(1.7, 2.1);
      p.smile = 0.7 * k(1.8, 2.2);
    } else if (t >= 2.2) {
      var s2 = k(2.2, 2.5) * (1 - k(2.9, 3.0));
      p.smile = s2; p.eyes = (t > 2.4 && t < 2.8) ? 0.05 : 1;
      p.look = lerp(0.75, 0.3, k(2.2, 2.6)) * side; p.roll = 0.12 * s2 * side;
    }
    return p;
  }

  function currentPose(t, fr) {
    var p = Rig.Pose(); p.breathe = Math.sin(t * 1.6);
    var tx = 0, ty = 0;
    if (A.pointer) { tx = clamp((A.pointer.x - fr.cx) / 240, -1, 1); ty = clamp((A.pointer.y - fr.cy) / 200, -1, 1); }
    var ts = A.trickStart;
    if (ts !== null && !(A.lastClick > ts || A.lastKey > ts) && t - ts < trickLength(A.trickKind, A.trickWhiff === true)) {
      var el = t - ts;
      if (A.trickKind === "swat" && A.trickWhiff === null && el >= 1.25) {
        var moved = A.pointer ? Math.hypot((A.pointer.x - fr.x) / SC - A.trickAimStage.x, (A.pointer.y - fr.y) / SC - A.trickAimStage.y) : 99;
        A.trickWhiff = moved > 45;
      }
      p = trickPose(A.trickKind, el, A.trickSide, A.trickAim, A.trickWhiff === true);
      var reach = p.reach; J.smooth(p, t, true); p.reach = reach; return p;
    }
    if (ts !== null) finishTrick(t);
    advanceTrickClock(t, fr);
    var blink = (t - born) % 3.7;
    p.eyes = blink > 3.55 ? 0.1 : 1;
    p.look = tx; p.gaze = tx * 1.4; p.lookY = ty; p.tilt = tx * 0.34; p.stretch = -ty;
    p.ears = 0.3 - ty * 0.4; p.wings = Math.max(0, -ty - 0.45) * 0.7;
    var rest = t - A.lastActivity;
    if (rest > 1.2) {
      // nobody is pointing: the owl moves on its own (look around, stretch up and squish down, tilt, flutter, nod...)
      var dd = {};
      if (M.update(t, dd)) { for (var kk in dd) { if (kk === "eyes") p.eyes = Math.min(p.eyes, dd.eyes); else if (kk === "gaze") p.gaze = (p.gaze || 0) + dd.gaze; else p[kk] = (p[kk] || 0) + dd[kk]; } }
      else { var side = Math.floor((rest - 1.2) / 2.2) % 2 === 0 ? 1 : -1; p.roll = side * 0.34; }
    } else { M.cancel(); p.roll = tx * 0.12; }
    J.smooth(p, t, false);
    return p;
  }
  function paint(pose, t) { o.clear(o.ctx); Rig.draw(o.ctx, o.base, pose, t, { bigBranch: { reach: reach, dark: false, mirror: false } }); }

  if (reduce) { paint(Rig.Pose(), 0); return; }
  var running = true, lastDraw = 0;
  document.addEventListener("visibilitychange", function () { running = !document.hidden; if (running) requestAnimationFrame(loop); });
  function loop(ts) {
    if (!running) return;
    if (ts - lastDraw >= 1000 / 31) { lastDraw = ts; var t = performance.now() / 1000; paint(currentPose(t, frameRect()), t); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
